<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAKAD - Pondok Pesantren Darul Amien</title>
    <!-- Google Fonts Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .hero-card {
            border-radius: 24px;
            background: #ffffff;
            box-shadow: 0 15px 35px rgba(25, 135, 84, 0.15);
            transition: transform 0.3s ease;
        }
        .hero-title {
            color: #198754;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .btn-custom-green {
            background-color: #198754;
            border-color: #198754;
            color: white;
            padding: 12px 40px;
            font-weight: 600;
            border-radius: 50px;
            transition: all 0.3s ease;
        }
        .btn-custom-green:hover {
            background-color: #157347;
            border-color: #146c43;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(25, 135, 84, 0.3);
        }
        .logo-img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="hero-card border-0 p-5">
                    
                    <!-- Logo Pesantren -->
                    <img src="LOGO PONDOK.png" alt="Logo Pondok Pesantren Darul Amien" class="logo-img mx-auto d-block">

                    <h1 class="hero-title mb-2 fs-3">Selamat Datang di SIAKAD</h1>
                    <h5 class="text-secondary fw-semibold mb-3">Pondok Pesantren Darul Amien</h5>
                    
                    <!-- Kalimat yang diperbarui -->
                    <p class="text-muted small mb-4">Sistem Informasi Akademik Kemadrasahan Darul Amien</p>
                    
                    <div>
                        <a href="login.html" class="btn btn-custom-green shadow-sm">
                            <i class="fas fa-sign-in-alt me-2"></i> Masuk ke Sistem
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
