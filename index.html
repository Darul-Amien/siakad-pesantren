<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAKAD - Pondok Pesantren Darul Amien</title>
    <!-- Google Fonts: Poppins untuk tampilan yang lebih menarik dan modern -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-title {
            color: #198754;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .btn-custom-green {
            background-color: #198754;
            border-color: #198754;
            color: white;
            padding: 12px 35px;
            font-weight: 600;
            border-radius: 50px;
            transition: all 0.3s ease;
        }
        .btn-custom-green:hover {
            background-color: #157347;
            border-color: #146c43;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(25, 135, 84, 0.3);
        }
        .card {
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card border-0 shadow-lg p-5 bg-white">
                    <h1 class="hero-title mb-3 fs-2">Selamat Datang di SIAKAD Pesantren</h1>
                    <p class="text-muted mb-4">Sistem Informasi Akademik Pondok Pesantren Darul Amien</p>
                    
                    <div>
                        <a href="login.html" class="btn btn-custom-green shadow-sm">
                            <i class="fas fa-sign-in-alt me-2"></i> Masuk ke Sistem
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
