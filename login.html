<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIAKAD Pesantren Darul Amien</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-custom-green {
            background-color: #198754 !important;
        }
        .btn-custom-green {
            background-color: #198754 !important;
            border-color: #198754 !important;
            color: white !important;
        }
        .btn-custom-green:hover {
            background-color: #157347 !important;
            border-color: #146c43 !important;
        }
        .text-custom-green {
            color: #198754 !important;
        }
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <img src="logo-pesantren.png" alt="Logo Darul Amien" style="width: 70px; height: 70px; object-fit: contain;" class="mb-3">
                        <h3 class="text-center mb-1 text-custom-green fw-bold">SIAKAD Darul Amien</h3>
                        <p class="text-center text-muted mb-4 small">Silakan masuk menggunakan akun Anda</p>
                        
                        <form id="loginForm" onsubmit="handleLogin(event)">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username / NIS / NIP</label>
                                <input type="text" class="form-control p-2" id="username" placeholder="Masukkan username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control p-2" id="password" placeholder="Masukkan password" required>
                            </div>
                            
                            <div id="errorAlert" class="alert alert-danger d-none py-2" role="alert">
                                Username atau Password salah!
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-custom-green btn-lg">Masuk</button>
                                <a href="index.html" class="btn btn-outline-secondary">Kembali ke Beranda</a>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyNt9ru4ZxOTjamBzzTKZkHSr5dMRc6fyTDepgtGIfrsf-7QLOUn-vEIGn46Hf0o7E6/exec';

        function handleLogin(event) {
            event.preventDefault();

            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorAlert = document.getElementById('errorAlert');
            const btnMasuk = document.querySelector('button[type="submit"]');

            errorAlert.classList.add('d-none');
            btnMasuk.innerText = "Memeriksa...";
            btnMasuk.disabled = true;

            const payload = {
                action: "login",
                username: user,
                password: pass
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                // Pengaturan pengarahan berdasarkan nama/tipe akun yang masuk
                if (user.toLowerCase() === "admin") {
                    localStorage.setItem("userRole", "admin");
                    localStorage.setItem("namaUser", "Administrator");
                    alert("Login Berhasil! Selamat datang Administrator");
                    window.location.href = "dashboard.html";
                } else if (user.toLowerCase().startsWith("santri") {
                    // Deteksi otomatis untuk akun santri
                    localStorage.setItem("userRole", "santri");
                    localStorage.setItem("namaUser", user);
                    alert("Login Berhasil! Selamat datang Santri " + user);
                    window.location.href = "dashboard-santri.html";
                } else {
                    // Default untuk guru / pengajar
                    localStorage.setItem("userRole", "guru");
                    localStorage.setItem("namaUser", user);
                    alert("Login Berhasil! Selamat datang " + user);
                    window.location.href = "dashboard.html";
                }
            })
            .catch(error => {
                errorAlert.classList.remove('d-none');
                btnMasuk.innerText = "Masuk";
                btnMasuk.disabled = false;
            });
        }
    </script>

</body>
</html>
