<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIAKAD Pesantren Darul Amien</title>
    <!-- Google Fonts Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
        }
        .bg-custom-green {
            background-color: #198754 !important;
        }
        .btn-custom-green {
            background-color: #198754 !important;
            border-color: #198754 !important;
            color: white !important;
            border-radius: 50px;
            font-weight: 600;
        }
        .btn-custom-green:hover {
            background-color: #157347 !important;
            border-color: #146c43 !important;
        }
        .text-custom-green {
            color: #198754 !important;
        }
        .card {
            border-radius: 20px;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5 text-center">
                        
                        <!-- Logo Pondok Pesantren Darul Amien -->
                        <img src="LOGO PONDOK.png" alt="Logo Pondok Pesantren Darul Amien" style="width: 80px; height: 80px; object-fit: contain;" class="mb-3 mx-auto d-block">
                        
                        <h3 class="mb-1 text-custom-green fw-bold">
                            SIAKAD<br>Darul Amien
                        </h3>
                        <p class="text-muted mb-4 small">Silakan masuk menggunakan akun Anda</p>
                        
                        <form id="loginForm" onsubmit="handleLogin(event)" class="text-start">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-medium small">Username / NIS / NIP</label>
                                <input type="text" class="form-control p-2" id="username" placeholder="Masukkan username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label fw-medium small">Password</label>
                                <input type="password" class="form-control p-2" id="password" placeholder="Masukkan password" required>
                            </div>
                            
                            <div id="errorAlert" class="alert alert-danger d-none py-2 small" role="alert">
                                Username atau Password salah!
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-custom-green btn-lg py-2">Masuk</button>
                                <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill mt-2">Kembali ke Beranda</a>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyNt9ru4ZxOTjamBzzTKZkHSr5dMRc6fyTDepgtGIfrsf-7QLOUn-vEIGn46Hf0o7E6/exec';
        
        // URL Web App Aplikasi Terintegrasi
        const urlAppPembayaran = 'https://script.google.com/macros/s/AKfycbxL3XmgGvcEUrgPkFx9OMUzGQ9aFhzBB2dXFMrYpgnDsPyXb6Nnj6xBgXKLAjnH1R0E/exec';
        const urlAppUks = 'https://script.google.com/macros/s/AKfycbw8k8BR4FT0IS7UcukeF0tdjdDyV_uF_b4KOUKEdmgps-hVpsQsjzUUtGRLLR-4aW2ZWA/exec';

        function handleLogin(event) {
            event.preventDefault();

            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorAlert = document.getElementById('errorAlert');
            const btnMasuk = document.querySelector('button[type="submit"]');

            if (!user || !pass) {
                alert("Harap isi username dan password!");
                return;
            }

            errorAlert.classList.add('d-none');
            btnMasuk.innerText = "Memeriksa...";
            btnMasuk.disabled = true;

            const payload = {
                action: "login",
                username: user,
                password: pass
            };

            fetch(scriptURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                btnMasuk.innerText = "Masuk";
                btnMasuk.disabled = false;

                if (data.status === "success") {
                    const userLower = user.toLowerCase();
                    const roleUser = data.role ? data.role.toLowerCase().trim() : "";
                    const namaLengkap = data.nama || user; // Mengambil nama dari Kolom C Spreadsheet

                    // Pengarahan halaman berdasarkan role atau username khusus
                    if (userLower === "admin_pembayaran") {
                        window.location.href = urlAppPembayaran;
                    } else if (userLower === "admin_uks") {
                        window.location.href = urlAppUks;
                    } else if (roleUser === "admin") {
                        localStorage.setItem("userRole", "admin");
                        localStorage.setItem("namaUser", namaLengkap);
                        window.location.href = "dashboard-admin.html";
                    } else if (roleUser === "walikelas" || roleUser === "wali_kelas") {
                        localStorage.setItem("userRole", "walikelas");
                        localStorage.setItem("namaUser", namaLengkap);
                        window.location.href = "dashboard-wali-kelas.html";
                    } else if (roleUser === "santri" || roleUser === "siswa") {
                        localStorage.setItem("userRole", "santri");
                        localStorage.setItem("namaUser", namaLengkap);
                        window.location.href = "dashboard-santri.html";
                    } else {
                        localStorage.setItem("userRole", "guru");
                        localStorage.setItem("namaUser", namaLengkap);
                        window.location.href = "dashboard-guru.html";
                    } else {
                        localStorage.setItem("userRole", "gerbang");
                        localStorage.setItem("namaUser", namaLengkap);
                        window.location.href = "dashboard-gerbang.html";
                } else {
                    errorAlert.innerText = data.message || "Username atau Password salah!";
                    errorAlert.classList.remove('d-none');
                }
            })
            .catch(error => {
                btnMasuk.innerText = "Masuk";
                btnMasuk.disabled = false;
                
                const userLower = user.toLowerCase();
                if (userLower === "admin_pembayaran") {
                    window.location.href = urlAppPembayaran;
                } else if (userLower === "admin_uks") {
                    window.location.href = urlAppUks;
                } else if (userLower === "admin" || userLower === "admin_pusat") {
                    localStorage.setItem("userRole", "admin");
                    localStorage.setItem("namaUser", user);
                    window.location.href = "dashboard-admin.html";
                } else {
                    localStorage.setItem("userRole", "guru");
                    localStorage.setItem("namaUser", user);
                    window.location.href = "dashboard-guru.html";
                } else {
                    localStorage.setItem("userRole", "gerbang");
                    localStorage.setItem("namaUser", user);
                    window.location.href = "dashboard-gerbang.html";
            });
        }
    </script>

</body>
</html>
