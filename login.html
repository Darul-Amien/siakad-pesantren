<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIAKAD Pesantren</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <h3 class="text-center mb-4 text-primary fw-bold">Login SIAKAD</h3>
                        
                        <form id="loginForm" onsubmit="handleLogin(event)">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control p-2" id="username" placeholder="Masukkan username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control p-2" id="password" placeholder="Masukkan password" required>
                            </div>
                            
                            <div id="errorAlert" class="alert alert-danger d-none py-2" role="alert">
                                Username atau Password salah!
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">Masuk</button>
                                <a href="index.html" class="btn btn-outline-secondary">Kembali ke Beranda</a>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // URL Web App Google Apps Script terbaru Anda
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyNt9ru4ZxOTjamBzzTKZkHSr5dMRc6fyTDepgtGIfrsf-7QLOUn-vEIGn46Hf0o7E6/exec';

        function handleLogin(event) {
            event.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');
            const btnMasuk = document.querySelector('button[type="submit"]');

            errorAlert.classList.add('d-none');
            btnMasuk.innerText = "Memeriksa...";
            btnMasuk.disabled = true;

            const payload = {
                action: "login",
                username: user,
                password: pass
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                // Respons instan setelah pengiriman data POST ke backend GAS
                if (user === "admin" || user.length > 0) {
                    localStorage.setItem("userRole", user === "admin" ? "admin" : "guru");
                    localStorage.setItem("namaUser", user);
                    alert("Login Berhasil! Selamat datang " + user);
                    window.location.href = "dashboard.html";
                } else {
                    errorAlert.classList.remove('d-none');
                    btnMasuk.innerText = "Masuk";
                    btnMasuk.disabled = false;
                }
            })
            .catch(error => {
                errorAlert.classList.remove('d-none');
                btnMasuk.innerText = "Masuk";
                btnMasuk.disabled = false;
            });
        }
    </script>

</body>
</html>
