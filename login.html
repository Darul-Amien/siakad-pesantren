<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIAKAD Pesantren</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <h3 class="text-center mb-4 text-primary fw-bold">Login SIAKAD</h3>
                        
                        <!-- Form Login -->
                        <form id="loginForm" onsubmit="handleLogin(event)">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username / NIS / NIP</label>
                                <input type="text" class="form-control p-2" id="username" placeholder="Masukkan username Anda" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control p-2" id="password" placeholder="Masukkan password" required>
                            </div>
                            
                            <!-- Tempat Pesan Error jika salah -->
                            <div id="errorAlert" class="alert alert-danger d-none py-2" role="alert">
                                Username atau Password salah!
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">Masuk</button>
                                <a href="index.html" class="btn btn-outline-secondary">Kembali ke Beranda</a>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script JavaScript untuk Cek Login -->
    <script>
        function handleLogin(event) {
            // Mencegah form agar tidak reload halaman secara otomatis
            event.preventDefault();

            // Mengambil nilai yang diketik pengguna
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');

            // CONTOH DATA LOGIN SEDERHANA
            // Nanti bagian ini bisa diganti dengan pengecekan ke Google Sheets / Database
            if (user === "admin" && pass === "12345") {
                alert("Login Berhasil! Selamat datang Admin.");
                // Di sini nanti bisa diarahkan ke halaman dashboard, contoh: window.location.href = "dashboard.html";
            } else if (user === "guru" && pass === "guru123") {
                alert("Login Berhasil! Selamat datang Guru.");
            } else {
                // Jika salah, tampilkan pesan error
                errorAlert.classList.remove('d-none');
            }
        }
    </script>

</body>
</html>
