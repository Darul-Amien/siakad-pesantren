<script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyNt9ru4ZxOTjamBzzTKZkHSr5dMRc6fyTDepgtGIfrsf-7QLOUn-vEIGn46Hf0o7E6/exec';

        function handleLogin(event) {
            event.preventDefault();

            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorAlert = document.getElementById('errorAlert');
            const btnMasuk = document.querySelector('button[type="submit"]');

            errorAlert.classList.add('d-none');
            btnMasuk.innerText = "Memeriksa...";
            btnMasuk.disabled = true;

            const payload = {
                action: "login",
                username: user,
                password: pass
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                // Logika pengarahan otomatis berdasarkan nama atau role pengguna
                const userLower = user.toLowerCase();
                
                if (userLower === "admin") {
                    localStorage.setItem("userRole", "admin");
                    localStorage.setItem("namaUser", "Administrator");
                    alert("Login Berhasil! Selamat datang Administrator");
                    window.location.href = "dashboard.html";
                } else if (userLower.includes("santri") || userLower.includes("ilham")) {
                    localStorage.setItem("userRole", "santri");
                    localStorage.setItem("namaUser", user);
                    alert("Login Berhasil! Selamat datang Santri " + user);
                    window.location.href = "dashboard-santri.html";
                } else {
                    localStorage.setItem("userRole", "guru");
                    localStorage.setItem("namaUser", user);
                    alert("Login Berhasil! Selamat datang " + user);
                    window.location.href = "dashboard.html";
                }
            })
            .catch(error => {
                errorAlert.classList.remove('d-none');
                btnMasuk.innerText = "Masuk";
                btnMasuk.disabled = false;
            });
        }
    </script>
