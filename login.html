<script>
        function handleLogin(event) {
            event.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');

            if (user === "admin" && pass === "12345") {
                // Simpan peran sebagai admin
                localStorage.setItem("userRole", "admin");
                localStorage.setItem("namaUser", "Administrator");
                alert("Login Berhasil! Selamat datang Admin.");
                window.location.href = "dashboard.html"; 
            } else if (user === "guru" && pass === "guru123") {
                // Simpan peran sebagai guru
                localStorage.setItem("userRole", "guru");
                localStorage.setItem("namaUser", "Bapak/Ibu Guru");
                alert("Login Berhasil! Selamat datang Guru.");
                window.location.href = "dashboard.html";
            } else {
                errorAlert.classList.remove('d-none');
            }
        }
    </script>
