<script>
        const scriptURL = 'URL_WEB_APP_ANDA_DISINI'; // <-- Masukkan URL GAS terbaru di sini

        function handleLogin(event) {
            event.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');
            const btnMasuk = document.querySelector('button[type="submit"]');

            btnMasuk.innerText = "Memeriksa...";
            btnMasuk.disabled = true;

            fetch(`${scriptURL}?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    localStorage.setItem("userRole", data.role);
                    localStorage.setItem("namaUser", data.nama);
                    alert("Login Berhasil! Selamat datang " + data.nama);
                    window.location.href = "dashboard.html";
                } else {
                    errorAlert.classList.remove('d-none');
                    btnMasuk.innerText = "Masuk";
                    btnMasuk.disabled = false;
                }
            })
            .catch(error => {
                alert("Terjadi kesalahan koneksi ke database.");
                btnMasuk.innerText = "Masuk";
                btnMasuk.disabled = false;
            });
        }
    </script>
