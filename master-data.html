<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Sistem - Pendaftaran & Manajemen Pengguna</title>
    <!-- Google Fonts Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
        }
        .bg-custom-green {
            background-color: #198754 !important;
        }
        .btn-custom-green {
            background-color: #198754 !important;
            border-color: #198754 !important;
            color: white !important;
            border-radius: 50px;
            font-weight: 600;
        }
        .btn-custom-green:hover {
            background-color: #157347 !important;
            border-color: #146c43 !important;
        }
        .card {
            border-radius: 20px;
        }
    </style>
</head>
<body class="bg-light" onload="loadUsers()">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-custom-green shadow-sm px-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-white" href="dashboard.html"><i class="fas fa-arrow-left me-2"></i>Kembali ke Dashboard</a>
        </div>
    </nav>

    <!-- Konten Utama -->
    <div class="container my-5">
        <div class="row justify-content-center">
            
            <!-- Form Tambah Pengguna -->
            <div class="col-md-10 mb-5">
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <h3 class="fw-bold text-success mb-3"><i class="fas fa-user-plus me-2"></i>Tambah Pengguna Baru</h3>
                    <p class="text-muted mb-4">Daftarkan akun guru, wali kelas, santri, atau admin baru ke dalam database SIAKAD.</p>

                    <form id="userForm" onsubmit="submitData(event)">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-medium">Nama Lengkap</label>
                                <input type="text" class="form-control p-2" id="nama" placeholder="Contoh: Muhammad Ilham" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-medium">Username / NIS / NIP</label>
                                <input type="text" class="form-control p-2" id="username" placeholder="Contoh: santri01" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-medium">Password</label>
                                <input type="text" class="form-control p-2" id="password" placeholder="Masukkan password" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-medium">Sebagai (Role)</label>
                                <select class="form-select p-2" id="role" required>
                                    <option value="" disabled selected>Pilih Hak Akses</option>
                                    <option value="guru">Guru / Pengajar</option>
                                    <option value="walikelas">Wali Kelas</option>
                                    <option value="santri">Santri / Siswa</option>
                                    <option value="admin">Administrator</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-grid mt-3">
                            <button type="submit" class="btn btn-custom-green btn-lg py-2" id="btnSimpan">
                                <i class="fas fa-save me-1"></i> Simpan ke Database
                            </button>
                        </div>
                    </form>
                    <div id="statusMsg" class="mt-3"></div>
                </div>
            </div>

            <!-- Tabel Daftar Pengguna Real-Time -->
            <div class="col-md-10">
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3 class="fw-bold text-success mb-0"><i class="fas fa-users me-2"></i>Daftar Pengguna Sistem</h3>
                        <button onclick="loadUsers()" class="btn btn-outline-success btn-sm rounded-pill px-3">
                            <i class="fas fa-sync-alt me-1"></i> Muat Ulang Data
                        </button>
                    </div>
                    <p class="text-muted small mb-4">Daftar seluruh akun yang aktif di database beserta kredensialnya.</p>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-success">
                                <tr>
                                    <th>No</th>
                                    <th>Nama Lengkap</th>
                                    <th>Username</th>
                                    <th>Password</th>
                                    <th>Role</th>
                                    <th class="text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody">
                                <tr>
                                    <td colspan="6" class="text-center text-muted py-4">Memuat data pengguna...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Script JavaScript -->
    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyNt9ru4ZxOTjamBzzTKZkHSr5dMRc6fyTDepgtGIfrsf-7QLOUn-vEIGn46Hf0o7E6/exec';

        // Fungsi Tambah Pengguna
        function submitData(event) {
            event.preventDefault();
            const btnSimpan = document.getElementById('btnSimpan');
            const statusMsg = document.getElementById('statusMsg');

            btnSimpan.innerText = "Menyimpan...";
            btnSimpan.disabled = true;

            const formData = {
                action: "register",
                nama: document.getElementById('nama').value.trim(),
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value.trim(),
                role: document.getElementById('role').value.trim()
            };

            fetch(scriptURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                statusMsg.innerHTML = `<div class="alert alert-success py-2 small">Berhasil! Pengguna baru telah ditambahkan.</div>`;
                document.getElementById('userForm').reset();
                btnSimpan.innerText = "Simpan ke Database";
                btnSimpan.disabled = false;
                loadUsers(); // Refresh tabel otomatis
            })
            .catch(error => {
                statusMsg.innerHTML = `<div class="alert alert-danger py-2 small">Gagal menyimpan: ${error}</div>`;
                btnSimpan.innerText = "Simpan ke Database";
                btnSimpan.disabled = false;
            });
        }

        // Fungsi Memuat Data Tabel Secara Real-Time via POST
        function loadUsers() {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Memuat data pengguna...</td></tr>`;

            fetch(scriptURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: "getUsers" })
            })
            .then(response => response.json())
            .then(users => {
                tbody.innerHTML = '';
                if (!Array.isArray(users) || users.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Belum ada data pengguna.</td></tr>`;
                    return;
                }

                users.forEach((user, index) => {
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${index + 1}</td>
                        <td class="fw-medium">${user.nama || '-'}</td>
                        <td><code>${user.username || '-'}</code></td>
                        <td><code>${user.password || '-'}</code></td>
                        <td><span class="badge bg-success bg-opacity-75">${user.role || '-'}</span></td>
                        <td class="text-center">
                            <button onclick="deleteUser(${user.row})" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                                <i class="fas fa-trash-alt me-1"></i> Hapus
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(error => {
                console.error("Error loading users:", error);
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Gagal memuat data dari server. Pastikan Deployment Apps Script sudah diperbarui.</td></tr>`;
            });
        }

        // Fungsi Hapus Pengguna
        function deleteUser(rowNumber) {
            if (confirm("Apakah Anda yakin ingin menghapus akun pengguna ini?")) {
                const payload = {
                    action: "delete",
                    row: rowNumber
                };

                fetch(scriptURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                })
                .then(response => response.json())
                .then(data => {
                    alert("Pengguna berhasil dihapus!");
                    loadUsers(); // Refresh tabel setelah hapus
                })
                .catch(error => {
                    alert("Gagal menghapus pengguna.");
                });
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
