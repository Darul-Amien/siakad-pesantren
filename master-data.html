<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Sistem - Pendaftaran Pengguna</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="dashboard.html"><i class="fas fa-arrow-left me-2"></i>Kembali ke Dashboard</a>
        </div>
    </nav>

    <!-- Konten Form -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <h3 class="fw-bold text-primary mb-3"><i class="fas fa-user-plus me-2"></i>Tambah Pengguna Baru</h3>
                    <p class="text-muted mb-4">Daftarkan akun guru atau santri baru agar bisa masuk ke sistem SIAKAD.</p>

                    <form id="userForm" onsubmit="submitData(event)">
                        <div class="mb-3">
                            <label class="form-label">Nama Lengkap</label>
                            <input type="text" class="form-control" id="nama" placeholder="Contoh: Ust. Ahmad" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Username / NIS / NIP</label>
                            <input type="text" class="form-control" id="username" placeholder="Contoh: guru02" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Masukkan password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Sebagai (Role)</label>
                            <select class="form-select" id="role" required>
                                <option value="guru">Guru / Pengajar</option>
                                <option value="admin">Administrator</option>
                            </select>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg" id="btnSimpan">
                                <i class="fas fa-save me-1"></i> Simpan ke Database
                            </button>
                        </div>
                    </form>
                    
                    <div id="statusMsg" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Kirim Data ke Google Apps Script -->
    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxLMEDlYT3iQqhQ6ChqwfDExldsaxCAwLitMKQ_v4ng6zIsMDJMGa3uGuqClO6nYMb0/exec'; // <-- Ganti dengan URL Apps Script Anda

        function submitData(event) {
            event.preventDefault();
            const btnSimpan = document.getElementById('btnSimpan');
            const statusMsg = document.getElementById('statusMsg');

            btnSimpan.innerText = "Menyimpan...";
            btnSimpan.disabled = true;

            const formData = {
                nama: document.getElementById('nama').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors', // Diperlukan untuk Apps Script
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            })
            .then(() => {
                statusMsg.innerHTML = `<div class="alert alert-success">Berhasil! Pengguna baru telah ditambahkan ke database.</div>`;
                document.getElementById('userForm').reset();
                btnSimpan.innerText = "Simpan ke Database";
                btnSimpan.disabled = false;
            })
            .catch(error => {
                statusMsg.innerHTML = `<div class="alert alert-danger">Gagal menyimpan: ${error}</div>`;
                btnSimpan.innerText = "Simpan ke Database";
                btnSimpan.disabled = false;
            });
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
